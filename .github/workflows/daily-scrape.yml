name: Daily Scrape

on:
  schedule:
    # Run daily at 6 AM UTC (1 AM EST)
    - cron: '0 6 * * *'
  
  # Allow manual trigger from GitHub Actions UI
  workflow_dispatch:
    inputs:
      states:
        description: 'States to scrape'
        required: false
        default: 'both'
        type: choice
        options:
          - both
          - MI
          - CT

jobs:
  # Michigan scrape job
  scrape-mi:
    if: ${{ github.event.inputs.states != 'CT' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install dependencies
        run: |
          cd backend
          pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Install Playwright browsers
        run: |
          playwright install firefox chromium
          playwright install-deps
      
      - name: Run MI scrape
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SCRAPE_STATE: MI
        run: |
          cd backend
          python -m scraper.main
      
      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Michigan scrape failed! Check the logs above."

  # Connecticut scrape job (runs in parallel)
  scrape-ct:
    if: ${{ github.event.inputs.states != 'MI' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install dependencies
        run: |
          cd backend
          pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Install Playwright browsers
        run: |
          playwright install firefox chromium
          playwright install-deps
      
      - name: Run CT scrape
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SCRAPE_STATE: CT
        run: |
          cd backend
          python -m scraper.main
      
      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Connecticut scrape failed! Check the logs above."
